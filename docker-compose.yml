services:
  ccs_backend:
    build: ./ccs_backend
    container_name: ccs_backend
    restart: unless-stopped
    # Szándékosan NINCS "ports:" - a backend csak a belső docker
    # hálózaton (ccs_internal) érhető el, a webről nem látszik.
    # Csak a ccs_frontend (nginx proxy) tudja elérni.
    expose:
      - "8800"
    environment:
      # A .env-ben felülírható; ha nincs .env, a fejlesztői alapértelmezést
      # használja (élesben MINDENKÉPP állítsd be a .env-ben).
      - CCS_AUTH_SECRET=${CCS_AUTH_SECRET:-change-this-ccs-admin-secret}
      - CCS_ANALYTICS_SALT=${CCS_ANALYTICS_SALT:-change-this-ccs-analytics-salt}
      - CCS_LOGS_DIR=/code/app/logs
      # GeoLite2 ONLINE web service (a látogatók országának feloldásához).
      # Üresen hagyva a számláló ország nélkül működik.
      - CCS_GEOIP_ACCOUNT_ID=${CCS_GEOIP_ACCOUNT_ID:-}
      - CCS_GEOIP_LICENSE_KEY=${CCS_GEOIP_LICENSE_KEY:-}
      - CCS_GEOIP_HOST=${CCS_GEOIP_HOST:-geolite.info}
    volumes:
      # Feltöltött QSL kártyák / adatbázis / logfájlok megőrzése újraindítás után.
      - ./ccs_backend/qsls:/code/app/qsls
      - ./ccs_backend/database:/code/app/database
      - ./ccs_backend/logs:/code/app/logs
    networks:
      # A frontend<->backend belső hálózat (nincs kifelé útvonala).
      - ccs_internal
      # KIFELÉ menő internet a GeoLite2 web service (MaxMind) eléréséhez.
      # A backendnek továbbra sincs "ports:" kulcsa, tehát BEFELÉ nem érhető
      # el a webről; ez a hálózat csak a kimenő HTTPS-hívásokat teszi lehetővé.
      - ccs_public

  ccs_frontend:
    image: nginx:1.27-alpine
    container_name: ccs_frontend
    restart: unless-stopped
    depends_on:
      - ccs_backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ccs_frontend/html:/var/www/html:ro
      - ./ccs_frontend/conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - ccs_internal
      - ccs_public
    # Az nginx 12 óránként újratölti a konfigot, hogy a certbot által
    # megújított tanúsítványokat felvegye.
    command: >
      /bin/sh -c 'while :; do sleep 12h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot
    container_name: ccs_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # 12 óránként megpróbálja megújítani a tanúsítványt (a certbot csak
    # a lejárathoz közel újít ténylegesen).
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

networks:
  # Belső hálózat: frontend <-> backend. internal: true miatt nincs kifelé
  # útvonala, így a backend semmiképp nem érhető el a webről.
  ccs_internal:
    internal: true
  # Publikus (nem internal) bridge hálózat. A frontend nginx ezen fogadja a
  # 80/443-at, a backend pedig ezen keresztül ér ki az internetre (GeoLite2
  # web service). A backendnek nincs "ports:" kulcsa, így befelé továbbra sem
  # érhető el a webről – csak kimenő forgalomra használja.
  ccs_public:
